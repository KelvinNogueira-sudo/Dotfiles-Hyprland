# --- General ---
general {
    hide_cursor = true
}

# --- Animations ---
animations {
    enable = true
    bezier = breathing, 0.4, 0.0, 0.2, 1.0
    bezier = morning_mist, 0.5, 0.0, 0.0, 1.0
    animation = fade, 1, 10, breathing
    animation = inputField, 1, 5, morning_mist
    animation = inputFieldDots, 1, 4, breathing
    }

# --- Wallpaper/Background ---
background {
    monitor =
    path = ~/Imagens/Wallpapers/Lockscreen.jpeg
    blur_passes = 1
}

# --- Profile Image ---
image {
    monitor =
    path = ~/Imagens/Wallpapers/HollowKnight_Profile.jpeg
    border_size = 3
    border_color = rgb(182, 199, 228)
    size = 150
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 0, -240
    halign = center
    valign = center
}

# --- Imput Field ---
input-field {
    monitor =
    size = 15%, 5%
    outline_thickness = 2
    inner_color = rgb(80, 80, 80)
    outer_color = rgb(182, 199, 228)
    font_color = rgb(182, 199, 228)
    fade_on_empty = false
    rounding = 20
    font_family = DepartureMono Nerd Font
    placeholder_text = Enter Password
    position = 0, 120
    halign = center
    valign = bottom
}

# --- Time ---
label {
    monitor =
    text = $TIME
    color = rgb(182, 199, 228)
    font_size = 150
    font_family = Heavy Data Nerd Font
    position = 0, -30
    halign = center
    valign = top
}   

# --- Day/Month ---
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%d de %B, %A")"
    color = rgb(182, 199, 228)
    font_size = 20
    font_family = DepartureMono Nerd Font
    position = 0, -240
    halign = center
    valign = top
}